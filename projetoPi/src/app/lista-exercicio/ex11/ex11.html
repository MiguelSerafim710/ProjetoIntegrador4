<h2>Carrinho de Compras</h2>

<h3>{{ produto }}</h3>

<p>Preço: R$ {{ preco }}</p>

<p>
  Quantidade:
  <button (click)="diminuir()" [disabled]="quantidade === 1">-</button>

  {{ quantidade }}

  <button (click)="aumentar()">+</button>
</p>

<p>
  Total: R$ {{ preco * quantidade }}
</p>

<button (click)="adicionarAoCarrinho()">
  Adicionar ao carrinho
</button>

<p>{{ mensagem }}</p>
